name: CI/CD - prevision-api

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: prevision-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: prevision_app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: prevision_app
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-test-only
      TEST_MYSQL: "1"

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            REQ_FILE="requirements.txt"
          else
            echo "requirements.txt nao encontrado. Gerando requirements.ci.txt com pipreqs."
            pip install pipreqs
            pipreqs . --force --mode no-pin --encoding=latin-1 --ignore .venv,data --savepath requirements.ci.txt || true

            if [ -f requirements.ci.txt ]; then
              REQ_FILE="requirements.ci.txt"
            else
              REQ_FILE=""
            fi
          fi

          if [ -n "${REQ_FILE}" ]; then
            pip install -r "${REQ_FILE}"
          else
            echo "Falha ao gerar requirements. Usando fallback de dependencias."
            pip install \
              fastapi \
              "uvicorn[standard]" \
              joblib \
              pandas \
              scikit-learn \
              imbalanced-learn \
              openmeteo-requests \
              requests-cache \
              httpx
          fi

          pip install -r requirements-auth.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest
          fi

      - name: Executar testes
        run: |
          python -c "from pathlib import Path; import mysql.connector, os; c=mysql.connector.connect(host=os.environ['MYSQL_HOST'], port=int(os.environ['MYSQL_PORT']), database=os.environ['MYSQL_DATABASE'], user=os.environ['MYSQL_USER'], password=os.environ['MYSQL_PASSWORD']); cur=c.cursor(); [cur.execute(s) for s in Path('schema.sql').read_text(encoding='utf-8').split(';') if s.strip()]; c.commit(); cur.close(); c.close()"
          if [ -d tests ]; then
            python -m pytest tests/ --tb=short -v
          else
            echo "Nenhum diretorio 'tests' encontrado - pulando etapa de testes."
          fi

  deploy:
    name: Deploy para EC2
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Copiar arquivos para a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_API_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "main.py,app.py,accounts.py,requirements.txt,requirements-auth.txt,schema.sql,modelo.pkl,data/,service/,repository/"
          target: /opt/prevision-api

      - name: Criar ambiente, instalar dependencias e reiniciar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_API_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euxo pipefail

            cd /opt/prevision-api

            # Garante permissao de escrita para o usuario ubuntu no diretorio da app
            sudo chown -R ubuntu:ubuntu /opt/prevision-api

            # Cria a virtualenv caso nao exista
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi

            source .venv/bin/activate

            python -m pip install --upgrade pip

            if [ -f requirements.txt ]; then
              pip install -r requirements.txt
            else
              echo "requirements.txt nao encontrado. Gerando requirements.ci.txt com pipreqs."
              pip install pipreqs
              pipreqs /opt/prevision-api --force --mode no-pin --encoding=latin-1 --ignore .venv,data --savepath /opt/prevision-api/requirements.ci.txt || true

              if [ -f /opt/prevision-api/requirements.ci.txt ]; then
                pip install -r /opt/prevision-api/requirements.ci.txt
              else
                echo "Falha ao gerar requirements. Usando fallback de dependencias."
                pip install \
                  fastapi \
                  "uvicorn[standard]" \
                  joblib \
                  pandas \
                  scikit-learn \
                  imbalanced-learn \
                  openmeteo-requests \
                  requests-cache \
                  httpx
              fi
            fi

            pip install -r requirements-auth.txt

            sudo systemctl restart prevision-api

            # Falha o job se o servico nao subir corretamente
            sudo systemctl is-active --quiet prevision-api
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:8000/health/ready; then
                exit 0
              fi
              sleep 2
            done

            sudo systemctl status prevision-api --no-pager
            exit 1
